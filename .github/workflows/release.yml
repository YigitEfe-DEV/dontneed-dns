name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version of the release, for example 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build the Linux archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          pip install build ruff

      - name: Check the formatting and the linter
        run: |
          ruff format --check src/ tests/ scripts/
          ruff check src/ tests/ scripts/

      - name: Run the tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: Build the archive
        run: python scripts/build_release.py --platform linux --output dist

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: dontneed-dns-linux-x86_64
          path: dist/dontneed-dns-linux-x86_64.zip
          if-no-files-found: error

  build-windows:
    name: Build the Windows archive and the executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          pip install build ruff pyinstaller

      - name: Check the formatting and the linter
        run: |
          ruff format --check src/ tests/ scripts/
          ruff check src/ tests/ scripts/

      - name: Run the tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: Build the executable
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name dontneed-dns `
            --collect-all dontneed_dns `
            --collect-all textual `
            --collect-all typer `
            --collect-all rich `
            src/dontneed_dns/__main__.py

      - name: Check that the executable starts
        shell: pwsh
        run: |
          & dist\dontneed-dns.exe version
          if ($LASTEXITCODE -ne 0) { throw "the executable did not start" }

      - name: Assemble the archive
        run: python scripts/build_release.py --platform windows --output dist --executable dist/dontneed-dns.exe

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: dontneed-dns-windows-x86_64
          path: |
            dist/dontneed-dns-windows-x86_64.zip
            dist/dontneed-dns.exe
          if-no-files-found: error

  check-windows-install:
    name: Check the Windows installation (Windows)
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: dontneed-dns-windows-x86_64
          path: dist

      - name: Unpack the archive
        shell: pwsh
        run: |
          Expand-Archive dist/dontneed-dns-windows-x86_64.zip -DestinationPath package -Force

      - name: Install, start, check and uninstall
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $package = "package/dontneed-dns-windows-x86_64"
          $exe = "$env:LOCALAPPDATA\dontneed-dns\dontneed-dns.exe"

          & (Join-Path $package 'install.ps1')
          foreach ($task in @('dontneed-dns-dns', 'dontneed-dns-proxy')) {
            schtasks /Query /TN $task | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "the task $task does not exist" }
          }
          & $exe dns start
          if ($LASTEXITCODE -ne 0) { throw "the resolver could not be started" }
          & $exe proxy start
          if ($LASTEXITCODE -ne 0) { throw "the proxy could not be started" }
          Start-Sleep -Seconds 8
          & $exe check
          if ($LASTEXITCODE -ne 0) { throw "the health check failed" }

          & (Join-Path $package 'uninstall.ps1')
          foreach ($task in @('dontneed-dns-dns', 'dontneed-dns-proxy')) {
            schtasks /Query /TN $task | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "the task $task still exists" }
          }
          Start-Sleep -Seconds 3
          $running = Get-Process dontneed-dns -ErrorAction SilentlyContinue
          if ($running) { throw "a process of the project is still running" }
          $global:LASTEXITCODE = 0
          exit 0

  publish:
    name: Publish the release
    needs: [build-linux, build-windows, check-windows-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute the checksums
        run: |
          cd dist
          # Every published file has to be listed.  A fallback that leaves
          # the executable out would publish it without a checksum.
          sha256sum -- *.zip *.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Verify the archives
        run: |
          python scripts/verify_release.py dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
