[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dontneed-dns"
version = "0.1.0"
description = "Cross-platform DNS-over-HTTPS and TLS fragmenting proxy management for Discord connectivity."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dontneed-dns contributors" }]
keywords = ["dns", "dns-over-https", "socks5", "proxy", "discord", "systemd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.60",
]

[project.optional-dependencies]
windows-service = ["pywin32>=306; sys_platform == 'win32'"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[project.urls]
Homepage = "https://github.com/YigitEfe-DEV/dontneed-dns"
Documentation = "https://github.com/YigitEfe-DEV/dontneed-dns/tree/main/docs"
Issues = "https://github.com/YigitEfe-DEV/dontneed-dns/issues"

[project.scripts]
dontneed-dns = "dontneed_dns.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dontneed_dns"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/packaging",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "packaging/linux/wheelhouse"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "UP",   # pyupgrade
    "RUF",  # ruff specific
    "BLE",  # blind except
]
ignore = [
    "SIM105",  # contextlib.suppress is not always clearer
    "B008",    # Typer relies on function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dontneed_dns"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "linux: tests that exercise the Linux edition",
    "windows: tests that exercise the Windows edition",
    "integration: tests that open real sockets",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/dontneed_dns"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
